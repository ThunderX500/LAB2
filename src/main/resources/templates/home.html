<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Temperature Converter</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="card">
    <h1>Temperature Converter</h1>

    <div class="error" th:switch="${error}">
        <p th:case="'FahrenheitFormatError'">
            Wrong value provided for Fahrenheit - must be a number
        </p>
        <p th:case="'CelsiusFormatError'">
            Wrong value provided for Celsius - must be a number
        </p>
        <p th:case="'OperationFormatError'">
            Wrong operation
        </p>
    </div>

    <form th:action="@{/convert}" method="get">
        <div class="field">
            <label for="celsius">Celsius:</label>
            <input
                id="celsius"
                name="celsius"
                type="text"
                th:value="${celsius}">
        </div>

        <div class="field">
            <label for="fahrenheit">Fahrenheit:</label>
            <input
                id="fahrenheit"
                name="fahrenheit"
                type="text"
                th:value="${fahrenheit}">
        </div>

        <div class="actions">
            <button type="submit" name="operation" value="CtoF">
                Celsius to Fahrenheit
            </button>
            <button type="submit" name="operation" value="FtoC">
                Fahrenheit to Celsius
            </button>
        </div>
    </form>
</div>
</body>
</html>
