<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="card">
    <h1>Calculator</h1>

    <div class="error" th:switch="${error}">
        <p th:case="'ArithmeticFormatError'">
            An exception occured during the operation
        </p>
        <p th:case="'OperationFormatError'">
            Unknown bad thing happened
        </p>
        <p th:case="'DivisionByZero'">
            You cannot divide by Zero
        </p>
    </div>

    <form th:action="@{/convert}" method="get">
        <div class="field">
            <label for="a">First Number:</label>
            <input
                id="a"
                name="a"
                type="text"
                th:value="${a}">
        </div>

        <div class="field">
            <label for="b">Second Number:</label>
            <input
                id="b"
                name="b"
                type="text"
                th:value="${b}">
        </div>

        <div class="field">
            <label for="result">Result:</label>
            <input
                id="result"
                name="result"
                type="text"
                th:value="${result}"
                readonly>
        </div>

        <div class="actions">
            <button type="submit" name="operation" value="add">
                +
            </button>
            <button type="submit" name="operation" value="subtract">
                -
            </button>
            <button type="submit" name="operation" value="multiply">
                *
            </button>
            <button type="submit" name="operation" value="divide">
                /
            </button>
        </div>
    </form>
</div>
</body>
</html>
